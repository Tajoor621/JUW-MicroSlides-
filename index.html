<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Quick-fix via Google Fonts CDN for Phase 1. This introduces an
      online dependency for font rendering — Phase 6 (PWA/offline
      hardening, see project plan Section F) will replace this with
      self-hosted font files under public/assets/fonts/ so the app
      stays fully offline-capable per the original $0/offline spec.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=Source+Sans+3:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>JUW-MicroSlides-</title>
  </head>
  <body class="bg-gray-100">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
